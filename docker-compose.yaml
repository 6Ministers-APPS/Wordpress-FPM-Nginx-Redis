# 👇 ИСПРАВЛЕНИЕ: Убраны отступы, блок прижат влево
volumes:
  # Сокет PHP-FPM, общий для wordpress и nginx
  php_socket:
  # Наш RAM-диск для кэша
  fastcgi_cache:
    driver_opts:
      type: tmpfs
      device: tmpfs
      # size=256M: параметры существующего тома менять нельзя (Compose требует пересоздать том, и деплой падает);
      # реальный размер кэша ограничивает max_size=110m в nginx.conf
      # uid=33,gid=33: владелец www-data (совпадает с nginx worker и PHP-FPM)
      o: "size=256M,mode=0755,uid=33,gid=33"
