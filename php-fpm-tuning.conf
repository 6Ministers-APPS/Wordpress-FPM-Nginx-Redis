[www]
; Unix-сокет вместо TCP (общий volume php_socket с nginx); перекрывает listen = 9000 из zz-docker.conf
listen = /var/run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand: простаивающий сайт не держит ни одного воркера (на сервере с несколькими сайтами это главная экономия RAM).
; Воркер поднимается за ~10 мс при первом запросе, а большинство страниц и так отдаёт FastCGI-кэш nginx.
pm = ondemand
; Потолок воркеров задаётся переменной окружения (docker-compose.yaml): 5 для обычного сайта, 8 для нагруженного
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 30s

; Защита от утечек памяти
pm.max_requests = 500

; Жёсткий потолок для зависшего скрипта. Должен быть не меньше fastcgi_read_timeout для /wp-admin/ (300s) в nginx
request_terminate_timeout = 300s

; Медленные запросы (>10 с) — стек вызова в лог контейнера, чтобы находить виновные плагины
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Эндпоинт для healthcheck (cgi-fcgi в docker-compose)
ping.path = /ping
ping.response = pong
