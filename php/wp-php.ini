; ------------------------------------
; Ресурсы и Лимиты
; ------------------------------------
; Лимит памяти одного PHP-процесса. Приходит из переменной окружения (docker-compose.yaml), по умолчанию 256M.
; Обычному запросу WordPress хватает 60–120 МБ. Админке WordPress сам поднимает лимит до WP_MAX_MEMORY_LIMIT (512M),
; а WP_MEMORY_LIMIT в wp-config.php поднимает лимит и для фронта — держите его не выше PHP_MEMORY_LIMIT.
memory_limit = ${PHP_MEMORY_LIMIT}

; Максимальный размер загружаемого файла (важно для восстановления бэкапов WPvivid)
upload_max_filesize = 256M
post_max_size = 256M

; Совпадает с request_terminate_timeout в php-fpm-tuning.conf
max_execution_time = 300
max_input_time = 300
expose_php = off

; Лимит переменных. Для Fluent Forms и больших меню Elementor лучше 5000.
max_input_vars = 5000

; Тайм-аут сокетов по умолчанию (file_get_contents, fsockopen). Зависший внешний сервис не должен держать воркер 5 минут
default_socket_timeout = 60

; ------------------------------------
; Opcache (Критично для производительности)
; ------------------------------------
; Включаем кэширование скомпилированного кода PHP
opcache.enable = 1

; Количество памяти под кэш кода.
; Размер из переменной окружения: 128 для обычного сайта, 192 для нагруженного
opcache.memory_consumption = ${OPCACHE_MEMORY}

; Количество скриптов, которые можно закэшировать. 
; WP + ваши плагины — это тысячи файлов. Дефолтных значений мало.
opcache.max_accelerated_files = 20000

; Буфер для хранения строк (ускоряет работу с текстом в коде)
opcache.interned_strings_buffer = 32

; Проверка обновлений файлов.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
; Elementor и Fluent читают PHPDoc-комментарии
opcache.save_comments = 1

; ------------------------------------
; JIT
; ------------------------------------
; Выключен: для WordPress (упирается в БД и I/O, а не в вычисления) выигрыш ~0–5%,
; а 128 МБ буфера на сайт — это память, нужная соседним сайтам.
opcache.jit = off
opcache.jit_buffer_size = 0

; ------------------------------------
; Другие настройки
; ------------------------------------
; Отключаем отображение ошибок на экране (безопасность), пишем их в лог
display_errors = Off
log_errors = On
; error_log не задан: ошибки идут в stderr (в FPM — через catch_workers_output в лог контейнера, виден в Coolify)

; Увеличиваем кэш путей к файлам (WP работает с кучей мелких файлов)
realpath_cache_size = 4096K
realpath_cache_ttl = 300
